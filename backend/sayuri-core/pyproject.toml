[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sayuri-core"
version = "0.1.0"
description = "Cognitive backend for SAYURI BEYOND"
requires-python = ">=3.12,<3.13"
dependencies = [
  "evoagentx==0.1.4",
  "hyperon==0.2.10",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1"
]
evolution = [
  "evoagentx[all]==0.1.4"
]

[project.scripts]
sayuri-core = "sayuri_core.__main__:main"
sayuri-core-health = "sayuri_core.healthcheck:main"
sayuri-evolution-health = "sayuri_core.evolution_healthcheck:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
